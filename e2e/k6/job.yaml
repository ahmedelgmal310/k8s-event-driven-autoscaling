# Template for the in-cluster k6 runs; e2e/run.sh fills in the __PLACEHOLDERS__.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-__NAME__
  namespace: loadtest
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/instance: __NAME__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        app.kubernetes.io/instance: __NAME__
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        pool: infra
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: mirror.gcr.io/grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
          args: ["run", "--quiet", "/scripts/__SCRIPT__"]
          env:
            - name: TARGET
              value: http://demo-api.demo.svc.cluster.local
            - name: SLO_P95_MS
              value: "__SLO__"
            - name: BURST_N
              value: "__BURST_N__"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
        - name: tmp
          emptyDir: {}
