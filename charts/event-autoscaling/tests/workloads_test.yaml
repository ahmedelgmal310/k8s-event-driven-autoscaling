suite: workloads
release:
  name: demo
  namespace: demo
tests:
  - it: leaves API replicas to the autoscaler
    template: templates/api.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.replicas
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0

  - it: sets a fixed replica count without the autoscaler
    template: templates/api.yaml
    set:
      api.autoscaling.enabled: false
      api.replicas: 4
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 4

  - it: drains gracefully (preStop sleep, readiness gate, grace period)
    template: templates/api.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: spreads API pods across zones (hard) and nodes (soft)
    template: templates/api.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          any: true
          content:
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          any: true
          content:
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway

  - it: runs hardened (non-root, read-only root fs, no capabilities, no token)
    template: templates/api.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: ["ALL"]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: sets requests and a memory limit but no CPU limit
    template: templates/api.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - exists:
          path: spec.template.spec.containers[0].resources.limits.memory
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu

  - it: runs the worker binary with a grace period for in-flight jobs
    template: templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/worker"]
      - notExists:
          path: spec.replicas
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: does not deploy Redis in prod (managed Redis)
    template: templates/redis.yaml
    values:
      - ../../../environments/prod/values.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Helm renders templates in reverse name order and stops at the first
  # error, so the failure surfaces in worker.yaml.
  - it: requires an address when the in-chart Redis is disabled
    template: templates/worker.yaml
    set:
      redis.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: redis.address is required when redis.enabled is false
